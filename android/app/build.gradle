// android/app/build.gradle
apply plugin: 'com.android.application'

android {
    namespace "com.global.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.global.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // ⚠️ IMPORTANT: Actuellement désactivé pour éviter le crash du plugin Push Notifications
            // Une fois les règles ProGuard ajoutées dans proguard-rules.pro, tu peux réactiver :
            // minifyEnabled true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            
            // Pour réactiver minifyEnabled avec les règles ProGuard :
            // 1. Change minifyEnabled false → true
            // 2. Assure-toi que proguard-rules.pro contient les règles pour Capacitor et Push Notifications
            // 3. Rebuild: ./gradlew clean assembleRelease
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // tes autres dépendances
}
